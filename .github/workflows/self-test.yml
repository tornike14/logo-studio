name: self-test
on:
  push:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [18, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node logo-studio/scripts/doctor.mjs
      - run: node logo-studio/scripts/self-test.mjs --network
  windows-powershell-5:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run from Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          node "logo-studio/scripts/doctor.mjs"
          node "logo-studio/scripts/self-test.mjs" --network
